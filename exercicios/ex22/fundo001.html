<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texte de Imagem de Fundo</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, rgb(104, 104, 179), rgb(131, 179, 131));
        }
        div.quadrado {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightgray;
            width: 350px;
            height: 350px;
        }
        div#q1 {
            background-color: skyblue;
        }
        div#q2 {
            background-image: linear-gradient(to bottom, yellow,red);
        }
        div#q3 {
            background-image: url(imagem/pattern001.png);
        }
        div#q4 {
            background-image: linear-gradient(to left, rgb(87, 65, 139), blue);
        }
        div#q5 {
            background-image: url(imagem/pattern004.png);
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">
        
    </div>
    <div class="quadrado" id="q2">
        
    </div>
    <div class="quadrado" id="q3">
        
    </div>
    <div class="quadrado" id="q4">
        
    </div>
    <div class="quadrado" id="q5">
       
    </div>
</body>
</html>
