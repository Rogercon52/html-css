<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container {
            background-image: url(imagem/target001.png);
            background-size: 100% 100%;

            position: relative;
            height: 94vh;
            background-color: purple;
            padding: 10px;
            border-radius:10px ;
        }
        #conteudo {
            background-image: url(imagem/target001.png);
            background-size: 100% 100%;

            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
            border-radius: 10px;
        }
        #main {
            background-color: aqua;
            background-image: url(imagem/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 100px;
            width: 100px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
            <main id="main">

            </main>
        </article>
    </section>
</body>
</html>
