<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo Videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu proprio servidor</p>
    <!--
    <video src="midia/meu-video.mp4.mp4" width="300" controls></video>
    <video src="midia/meu-video.m4v.mp4" width="300" controls></video>
    <video src="midia/meu-video.ogv.ogv" width="300" controls></video>
    -->
    <video width="500" height="500" poster="midia/meu-video.mp4.mp4" controls  loop>
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <source src="midia/meu-video.m4v.mp4" type="video/m4v">
        <source src="midia/meu-video.ogv.ogv" type="video/ogv">
        <source src="midia/Meu-Video.webm.webm" type="video/webm">
        <p>
            Seu navegador não tem compatibilidade com reprodução de vídeo
        </p>
    </video>
    <p>Inserindo videos do Youtube</p>
    <iframe width="500" height="500"  src="https://www.youtube.com/embed/ijqjqwiNdV4?si=W-Agzp8IRFKVME0P" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <p></p>
    <iframe src="https://player.vimeo.com/video/29315013?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="500" height="281" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" title="Animation Reel"></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/9eThXjopUm8?si=JL2Tr8JUmnCkWGqW" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>Inserindo video do Vimeo</h1>
    <div style="padding:50% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/267490452?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" style="position:absolute;top:0;left:0;width:40%;height:60%;" title="Character Animation Reel"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
