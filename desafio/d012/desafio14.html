<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        table {
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            border-collapse: collapse;
            font-size: 2em;
        }
        td, th {
            border: 2px solid black;
            width: 120px;
            height: 50px;
            text-align: left;
        }
        thead {
            text-align: center;
            color: white;
        }
        thead > tr > th  {
            text-align: center;
        }
        .numero {
            text-align: right;
        }
        .centro {
            text-align: center;
        }
        .cor {
            background-color: gray;
        }
        .cor1 {
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead class="centro">
            <tr class="cor">
                <th rowspan="3" scope="row">Área</th>
                <th rowspan="2" scope="row">Disciplina</th>
                <td colspan="2" class="centro" >Notas</td>
                <td rowspan="2" class="centro">Média</td>
            </tr>
            <tr class="cor">
                <th class="centro">Nota 1</th>
                <th class="centro">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr>
                <th>Física</th>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr>
                <th>Química</th>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr>
                <th>Biologia</th>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr class="cor">
                <th colspan="4" class="cor1">Média de Exatas</th>
                <td class="numero + cor1">0,0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr>
                <th>Geografia</th>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
                <td class="numero">0,0</td>
            </tr>
            <tr class="cor">
                <th colspan="4" class="cor1">Média de Humanas</th>
                <td class="numero">0,0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
